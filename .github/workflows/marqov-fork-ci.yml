name: marqov-quantumflow CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Default token scope for all jobs; publish jobs add id-token below.
permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: floor
            numpy: "numpy==1.26.0"
            scipy: "scipy==1.11.2"
          - axis: ceiling
            numpy: "numpy<2.4"
            scipy: "scipy"
    name: test (py3.12, ${{ matrix.axis }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # setuptools_scm needs tags/history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # MINIMAL install on purpose. We do NOT install ".[dev]" — it pulls heavy
      # optional SDKs (qiskit, cirq, qutip, pyquil, amazon-braket-sdk) whose own
      # numpy/scipy constraints could drag the axis pin off its target or fail
      # resolution, silently defeating the dual-axis test. The axis specs become
      # a pip CONSTRAINTS file applied to every install in this job, so the
      # resolver itself fails loudly if anything would move numpy/scipy — the
      # axis cannot drift silently. QuantumFlow's integration tests (x*_test.py)
      # each call pytest.importorskip(...) at module top, so without those SDKs
      # they SKIP cleanly — this job validates the numerical CORE across the
      # numpy/scipy matrix, which is exactly where the scipy-cap compatibility
      # risk lives.
      - name: Pin numpy/scipy to the axis, add pytest
        run: |
          python -m pip install --upgrade pip
          # Specifier-less entries (bare "scipy" on the ceiling axis) constrain
          # nothing and some pip versions reject them in constraints files; skip.
          for spec in '${{ matrix.numpy }}' '${{ matrix.scipy }}'; do
            case "$spec" in
              *[\<\>=~!]*) echo "$spec" >> "$RUNNER_TEMP/axis-constraints.txt" ;;
            esac
          done
          echo "axis constraints:" && cat "$RUNNER_TEMP/axis-constraints.txt"
          pip install -c "$RUNNER_TEMP/axis-constraints.txt" "${{ matrix.numpy }}" "${{ matrix.scipy }}" pytest packaging
      - name: Install the fork's core runtime deps (constraints keep the axis authoritative)
        run: pip install . -c "$RUNNER_TEMP/axis-constraints.txt"
      - name: Assert installed numpy/scipy still satisfy the axis
        env:
          AXIS_SPECS: ${{ matrix.numpy }};${{ matrix.scipy }}
        run: |
          python - <<'PY'
          import os, sys
          from importlib.metadata import version
          from packaging.requirements import Requirement

          ok = True
          for spec in os.environ["AXIS_SPECS"].split(";"):
              req = Requirement(spec.strip())
              got = version(req.name)
              good = not req.specifier or req.specifier.contains(got, prereleases=True)
              print(f"{req.name} {got} vs '{req.specifier or 'any'}':", "OK" if good else "VIOLATION")
              ok = ok and good
          sys.exit(0 if ok else 1)
          PY
      - name: Run QuantumFlow's bundled test suite (integration tests self-skip)
        run: pytest quantumflow -q -rs   # -rs lists skipped tests so the skips are visible, not silent
      - name: Packaging metadata check
        run: ./tools/check_metadata.sh

  # TestPyPI exercises the publish MECHANISM on prerelease (rc) tags, e.g. v1.0.0rc1.
  # This burns an rc version on TestPyPI, never the clean 1.0.0.
  # The job-level `if:` routes; the Gate step inside enforces the EXACT tag
  # shape, so a malformed or non-rc prerelease tag publishes nowhere at all.
  publish-testpypi:
    needs: test-matrix
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Gate on exact rc tag shape (vX.Y.ZrcN only)
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]] \
            || { echo "FAIL: '$GITHUB_REF_NAME' is not an rc tag (vX.Y.ZrcN); refusing to publish"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - name: Build
        run: python -m pip install build && python -m build
      - name: Assert built version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/marqov_quantumflow-${TAG}-py3-none-any.whl" \
            || { echo "FAIL: built wheel is not version ${TAG}"; ls dist/; exit 1; }
          test -f "dist/marqov_quantumflow-${TAG}.tar.gz" \
            || { echo "FAIL: built sdist is not version ${TAG}"; ls dist/; exit 1; }
          echo "version OK: ${TAG}"
      - name: Verify the built wheel (install-and-import in a clean venv)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/pip" install --quiet dist/*.whl packaging
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-verify/bin/python" "$GITHUB_WORKSPACE/tools/verify_wheel.py"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # Real PyPI publishes only on FINAL tags, and only after tests pass.
  # The Gate step requires exactly vX.Y.Z — alpha/beta/dev tags (which contain
  # no 'rc' and would otherwise slip through the substring routing) are refused.
  publish-pypi:
    needs: test-matrix
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Gate on exact final tag shape (vX.Y.Z only)
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "FAIL: '$GITHUB_REF_NAME' is not a final release tag (vX.Y.Z); refusing to publish"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - name: Build
        run: python -m pip install build && python -m build
      - name: Assert built version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/marqov_quantumflow-${TAG}-py3-none-any.whl" \
            || { echo "FAIL: built wheel is not version ${TAG}"; ls dist/; exit 1; }
          test -f "dist/marqov_quantumflow-${TAG}.tar.gz" \
            || { echo "FAIL: built sdist is not version ${TAG}"; ls dist/; exit 1; }
          echo "version OK: ${TAG}"
      - name: Verify the built wheel (install-and-import in a clean venv)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/pip" install --quiet dist/*.whl packaging
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-verify/bin/python" "$GITHUB_WORKSPACE/tools/verify_wheel.py"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
